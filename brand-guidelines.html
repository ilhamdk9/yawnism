<body>
    <div id="app">
        <aside id="sidebar">
            <div class="brand">
                <h1>🐱 Yawnism</h1><small>Admin</small>

                <a href="brand-guidelines.html" class="nav-link active">🎨 Guideline</a>
                <a href="orders.html" class="nav-link">🛒 Orders</a>
                <a href="settings.html" class="nav-link">⚙️ Settings</a>
                <button id="logoutBtn" class="logout">🐾 Logout</button>
            </nav>
            <div class="cat-footer"><img src="https://cataas.com/cat/sleepy"></div>
        </aside>

        <main id="main">
            <header><button id="menuBtn">🐾</button>
                <div class="header-cat"><span>Hi, <b id="userInfo">...</b></span></div>
            </header>
            <section id="content">
                <div class="header-flex">
                    <h2>Yawnism Guideline</h2>
                    <button id="btnAddCategory" class="btn-primary">+ Buat Grup Baru</button>
                </div>
                <div id="bgCategories" class="list-container">Loading...</div>
            </section>
        </main>

        <div id="modalCategory" class="modal-overlay hidden">
            <div class="modal-content">
                <form id="categoryForm">
                    <h3 style="margin-bottom:20px; color:var(--primary)">📁 Grup Guideline</h3>
                    <label>Nama Grup</label>
                    <input name="name" required placeholder="Contoh: Moodboard 2025">
                    <div class="form-actions">
                        <button type="button" id="categoryCancel" class="btn-secondary">Batal</button>
                        <button type="submit" class="btn-primary">Simpan Grup</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modalBGItem" class="modal-overlay hidden">
            <div class="modal-content">
                <form id="bgItemForm">
                    <h3 style="margin-bottom:20px; color:var(--primary)">🔗 Data Link</h3>
                    <label>Judul Link</label>
                    <input name="name" required placeholder="Contoh: Pinterest Board">
                    <label>URL / Link</label>
                    <input name="link" type="url" required placeholder="https://...">
                    <label>Catatan Singkat</label>
                    <textarea name="note" rows="3" placeholder="Tambahkan keterangan..."></textarea>
                    <div class="form-actions">
                        <button type="button" id="bgItemCancel" class="btn-secondary">Batal</button>
                        <button type="submit" class="btn-primary">Simpan Link</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
